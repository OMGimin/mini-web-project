spring.application.name=web-mini-backend
server.port=${SERVER_PORT:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.demo-user.header-name=${APP_DEMO_USER_HEADER_NAME:X-Demo-User-Id}
app.websocket.endpoint=${APP_WEBSOCKET_ENDPOINT:/ws}
app.websocket.heartbeat=${APP_WEBSOCKET_HEARTBEAT:10000,10000}
app.websocket.message-size-limit=${APP_WEBSOCKET_MESSAGE_SIZE_LIMIT:65536}
app.websocket.send-buffer-size-limit=${APP_WEBSOCKET_SEND_BUFFER_SIZE_LIMIT:131072}
app.websocket.send-time-limit=${APP_WEBSOCKET_SEND_TIME_LIMIT:20000}
app.ai.provider=${APP_AI_PROVIDER:mock}
app.ai.prompt-version=${APP_AI_PROMPT_VERSION:judge-v1}
app.ai.base-url=${APP_AI_BASE_URL:http://ai-service:8000}
app.ai.timeout-seconds=${APP_AI_TIMEOUT_SECONDS:60}
app.trial.introduction-seconds=${APP_TRIAL_INTRODUCTION_SECONDS:7}
app.trial.argument-seconds=${APP_TRIAL_ARGUMENT_SECONDS:10}
app.trial.debate-turns=${APP_TRIAL_DEBATE_TURNS:4}
app.trial.debate-interval-seconds=${APP_TRIAL_DEBATE_INTERVAL_SECONDS:8}
app.trial.voting-seconds=${APP_TRIAL_VOTING_SECONDS:15}
app.trial.scheduler-enabled=${APP_TRIAL_SCHEDULER_ENABLED:true}
app.trial.scheduler-interval-millis=${APP_TRIAL_SCHEDULER_INTERVAL_MILLIS:1000}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webmini}
spring.datasource.username=${DB_USERNAME:webmini}
spring.datasource.password=${DB_PASSWORD:webmini}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
